
mutation($id: UUID!, $name: String, $surname: String, $email: String) {
  result: userInsert(user: {id: $id, name: $name, surname: $surname, email: $email}) {
    ...User
    ...Error
  }
}

fragment Error on InsertError {
  __typename
  failed
  input
  msg
}

fragment User on UserGQLModel {
  __typename
  id
  lastchange
  name
  surname
  email
  isThisMe
  rolesOn {
    id
    user {
      email
    }
    roletype {
      name
    }
  }
  memberOf {
    name
  }
  id
}