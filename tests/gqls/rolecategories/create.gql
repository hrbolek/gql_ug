mutation RoleCategoryInsert($id: UUID, $name: String!) {
  result: roleCategoryInsert(roleCategory: {id: $id, name: $name}) {
    ...RoleCategory
    ...Error
  }
}

fragment Error on InsertError {
  __typename
  failed
  input
  msg
}

fragment RoleCategory on RoleCategoryGQLModel {
	__typename
  id
  lastchange
  name
  nameEn
  
  created
  createdby { id email }
  changedby { id email }
}