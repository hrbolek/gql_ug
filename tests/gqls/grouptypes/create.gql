
mutation($id: UUID, $name: String!, $name_en: String) {
  result: groupTypeInsert(groupType: {id: $id, name: $name, nameEn: $name_en}) {
    ...Error
    ...GroupTypeModel
  }
}

fragment Error on InsertError {
  __typename
  failed
  input
  msg
}


fragment GroupTypeModel on GroupTypeGQLModel {
  __typename
  id
  lastchange
  name
  nameEn
}