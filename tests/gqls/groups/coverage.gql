query ($id: UUID!) {
  result: groupById(id: $id) {
    ...GroupModel
  }
}

fragment GroupModel on GroupGQLModel {
  __typename
  id
  lastchange
  name
  nameEn
  rbacobject {
    id
  }
  subgroups {
    id
    name
  }
  mastergroups {
    id
    name
  }
  rolesOn {
    id
    valid
    deputy
    userId
  }
}

