mutation($id: UUID, $name: String!, $name_en: String) {
  result: groupCategoryInsert(groupCategory: {id: $id, name: $name, nameEn: $name_en}) {
    ...GroupCategoryModel
    ...Error
  }
}

fragment Error on InsertError {
  __typename
  failed
  input
  msg
}

fragment GroupCategoryModel on GroupCategoryGQLModel {
  __typename
    id
    lastchange
    name
    nameEn

    rbacobject { id }
}