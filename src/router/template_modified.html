<!DOCTYPE html>
<html lang="en">
<head>
  <title>GQL Model Viewer</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>  

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/htm@2.2.1" crossorigin></script>

  <script src="https://unpkg.com/@reduxjs/toolkit@1.9.3/dist/redux-toolkit.umd.js"></script>

<script>
  let introspectionData = null;
  let typesByName = {};

  const introspectionQuery = `
    query IntrospectionQuery {
      __schema {
        queryType { name }
        types {
          name
          kind
          fields {
            name
            args {
              name
              type {
                kind
                name
                ofType {
                  kind
                  name
                  ofType {
                    kind
                    name
                  }
                }
              }
            }
            type {
              kind
              name
              ofType {
                kind
                name
                ofType {
                  kind
                  name
                }
              }
            }
          }
        }
      }
    }
  `;

  fetch('/gql', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: introspectionQuery })
  })
  .then(res => res.json())
  .then(result => {
    introspectionData = result.data;
    const types = introspectionData.__schema.types;
    types.forEach(t => { typesByName[t.name] = t; });
  });

  function getNamedType(typeRef) {
    while (typeRef && typeRef.ofType) {
      typeRef = typeRef.ofType;
    }
    return typeRef;
  }

  function generateQueryExample(field, typesByName) {
    const args = field.args || [];
    const varDefs = args.map(arg => `$${arg.name}: ${getNamedType(arg.type).name}!`).join(", ");
    const fieldArgs = args.map(arg => `${arg.name}: $${arg.name}`).join(", ");
    const query = `query ${field.name}(${varDefs}) {
  ${field.name}(${fieldArgs}) {
    __typename
    id
  }
}`;
    return query;
  }
</script>

</head>

<body>

    <!-- <div class="container-fluid p-3 bg-success bg-opacity-10 text-center">
        <h1>Přijímací řízení 2025/26</h1>

    <div id="root"></div>

    <script type="text/babel">

        const data = `data`
        const query = `query`

        const { useState, useRef } = React;
        const { configureStore, createSlice } = RTK;
        console.log("React", JSON.stringify(React))
        
        const Row = ({children, className, ...props}) => {
            return (
                <div {...props} className={className?className+" row": "row"}>
                    {children}
                </div>
            )
        }

        const Col = ({children, className, ...props}) => {
            return (
                <div {...props} className={className?className+" col": "col"}>
                    {children}
                </div>
            )
        }
        const CardCapsule = ({children}) => <div className="card"><div className="card-body">{children}</div></div>
        const Table = ({data}) => {
            if (data.length == 0) {
                return null
            }
            const row = data[0]
            const attribute_names = Object.keys(row)
            /* attribute_names.push("link") */ 
            
            return (
            <div class="table-responsive">
                <table className="table table-stripped">
                    <thead>
                    <tr>
                        {attribute_names.map(name => <th key={name}>{name}</th>)}
                    </tr>
                    </thead>
                    <tbody>
                    {data.map(row => <TableRow key={row?.id} datarow={row} attributes={attribute_names} />)}
                    </tbody>
                </table>
            </div>
            )
        }
        
        const Link = ({ item }) => {
          const [data, setData] = React.useState(null);
          const [loading, setLoading] = React.useState(false);

          const handleClick = async (e) => {
            e.preventDefault();
            setLoading(true);

            const typename = item.__typename;
            const id = item.id;

            const queryType = introspectionData?.__schema?.types?.find(t => t.name === introspectionData.__schema.queryType.name);
            const field = queryType?.fields?.find(f =>
              f.args?.some(arg =>
                arg.name === "id" &&
                getNamedType(arg.type).name === "UUID"
              ) &&
              getNamedType(f.type).name === typename
            );

            if (!field) {
              console.error("Query field not found for", typename);
              return;
            }

            const gqlQuery = generateQueryExample(field, typesByName);
            const variables = { id };

            try {
              const res = await fetch("/gql", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: gqlQuery, variables })
              });
              const json = await res.json();
              const resultData = json.data?.[field.name];
              setData(resultData);
            } catch (err) {
              console.error("Fetch error", err);
            } finally {
              setLoading(false);
            }
          };

          if (loading) return <span>Načítám…</span>;
          if (data) return <MediumCard item={data} />;

          return <a href="#" onClick={handleClick}>{item.name || item.id}</a>;
        };

             /* <a href={f`../${item?.__typename?.toLowerCase()}/${item?.id}`}>
                  {item?.name || item?.id}
              </a>*/
            return (
              <>
              <a href={`../${item?.__typename?.toLowerCase()}/${item?.id}`}>{item?.id}</a>
              </>
            )
        }

        const MediumCard = ({item}) => {
            return (
                <CardCapsule>
                    {Object.entries(item).map(([attribute_name, attribute_value]) => {
                        let attribute_value_result = JSON.stringify(attribute_value)
                        if (Array.isArray(attribute_value))
                            // attribute_value_result = <CardCapsule><Table data={attribute_value} /></CardCapsule>
                            return null
                        else if (typeof attribute_value === "object" && attribute_value !== null) 
                            // attribute_value_result = <MediumCard item={attribute_value} />
                            return null
                        else if (attribute_name === "__typename") {
                            /*attribute_value_result = <Link item={attribute_value} />*/
                            console.log(attribute_name, attribute_value)
                        }
                        if (attribute_name === "id")
                            attribute_value_result = <Link item={item} />
                        if (attribute_value)
                            return (
                                <Row key={attribute_name}>
                                    <Col className="col-4"><b>{attribute_name}</b></Col>
                                    <Col className="col-8">{attribute_value_result}</Col>
                                </Row>
                            )
                        else return null
                    })}
                    {Object.entries(item).map(([attribute_name, attribute_value]) => {
                        let attribute_value_result = JSON.stringify(attribute_value)
                        if (Array.isArray(attribute_value))
                            // attribute_value_result = <CardCapsule><Table data={attribute_value} /></CardCapsule>
                            return null
                        else if (typeof attribute_value === "object" && attribute_value !== null) 
                            // attribute_value_result = <MediumCard item={attribute_value} />
                            return null
                        else if (attribute_name === "__typename") {
                            /*attribute_value_result = <Link item={attribute_value} />*/
                            console.log(attribute_name, attribute_value)
                        }
                        if (attribute_value)
                            return null
                        else
                            return (
                                <Row key={attribute_name}>
                                    <Col className="col-4"><b>{attribute_name}</b></Col>
                                    <Col className="col-8">{attribute_value_result}</Col>
                                </Row>
                            )
                    }
                )}
                </CardCapsule>
            )
        }

        const MiddleCardVectors = ({item}) => {
            return (
                <CardCapsule>
                    {Object.entries(item).map(([attribute_name, attribute_value]) => {
                        if (Array.isArray(attribute_value)) {
                            return (
                              <Row key={attribute_name}>
                                  <Col className="col-2"><b>{attribute_name}</b></Col>
                                  <Col className="col-10">
                                      <CardCapsule>
                                          <Table data={attribute_value} />
                                      </CardCapsule>
                                  </Col>
                              </Row>
                            )
                        } else {
                          return null
                        }
                    }
                )}
                </CardCapsule>
            )
        }

        const MiddleCardScalars = ({item}) => {
            return (
                <CardCapsule>
                    {Object.entries(item).map(([attribute_name, attribute_value]) => {
                        if (Array.isArray(attribute_value)) return null
                        if (typeof attribute_value === "object" && attribute_value !== null) {
                            return (
                              <Row key={attribute_name}>
                                  <Col className="col-2"><b>{attribute_name}</b></Col>
                                  <Col className="col-10">
                                      <MediumCard item={attribute_value} />
                                  </Col>
                              </Row>
                            )
                        }   
                        else {
                           return null
                        }
                    }
                )}
                </CardCapsule>
            )
        }

        const TableRow = ({datarow={}, attributes=[]}) => {
            datarow["link"] = <Link item={datarow} />
            return (
                <tr>
                    {attributes.map(name => name==="id"?<td key={name}><Link item={datarow} /></td>:<td key={name}>{datarow[name]}</td>)}
                </tr>
            )
        }
        // <MiddleCardScalars item={data} />
        // <MiddleCardVectors item={data} />
                        
        const App = () => {
          return (
            <div className="container-fluid mt-5">
                <Row>
                    <Col className="col-4">
                        <MediumCard item={data} />
                    </Col>
                    <Col className="col-8">
                        <MiddleCardScalars item={data} />
                        <MiddleCardVectors item={data} />
                    </Col>
                </Row>

                
                <pre>{query}</pre>
                <pre>{JSON.stringify(data, null, 4)}</pre>
            </div>
          );
        };


        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

    </script>

</body>
