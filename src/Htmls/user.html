<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User selector</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background: #f8f9fa;
        }

        .user-card.active {
            border: 2px solid #0d6efd;
            box-shadow: 0 0.5rem 1rem rgba(13, 110, 253, 0.15);
        }

        .role-badge {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container-fluid bg-primary text-white p-3">
        <div class="container">
            <h3 class="mb-0">User selector</h3>
            <small>Výběr current_user z available_users</small>
        </div>
    </div>

    <div class="container my-4">
        <div id="root"></div>
    </div>

    <script type="text/babel">
        const { useEffect, useState } = React

        function RoleList({ roles }) {
            if (!roles || roles.length === 0) {
                return <div className="text-muted">Uživatel nemá žádné role.</div>
            }

            return (
                <div className="list-group">
                    {roles.map((role, index) => (
                        <div key={index} className="list-group-item">
                            <div className="d-flex justify-content-between align-items-center mb-2">
                                <strong>{role.roletype?.name || "bez názvu role"}</strong>
                                <span className={`badge ${role.valid ? "bg-success" : "bg-secondary"} role-badge`}>
                                    {role.valid ? "validní" : "nevalidní"}
                                </span>
                            </div>

                            <div><strong>Skupina:</strong> {role.group?.name || "-"}</div>
                            <div className="text-muted small"><strong>group.id:</strong> {role.group?.id || "-"}</div>
                            <div className="text-muted small"><strong>roletype.id:</strong> {role.roletype?.id || "-"}</div>
                        </div>
                    ))}
                </div>
            )
        }

        function UserCard({ user, isCurrent, onSelect }) {
            return (
                <div className={`card mb-3 user-card ${isCurrent ? "active" : ""}`}>
                    <div className="card-body">
                        <div className="d-flex justify-content-between align-items-start gap-3">
                            <div>
                                <h5 className="card-title mb-1">{user.fullname}</h5>
                                <div className="text-muted">{user.email}</div>
                                <div className="small text-muted mt-2">id: {user.id}</div>
                                <div className="mt-2">
                                    <span className="badge bg-light text-dark">
                                        role count: {user.roles?.length || 0}
                                    </span>
                                    {isCurrent && (
                                        <span className="badge bg-primary ms-2">current_user</span>
                                    )}
                                </div>
                            </div>

                            <button
                                className={`btn ${isCurrent ? "btn-outline-secondary" : "btn-primary"}`}
                                onClick={() => onSelect(user)}
                                disabled={isCurrent}
                            >
                                {isCurrent ? "Vybráno" : "Nastavit jako current_user"}
                            </button>
                        </div>
                    </div>
                </div>
            )
        }

        function App() {
            const [users, setUsers] = useState([])
            const [currentUser, setCurrentUser] = useState(null)
            const [selectedUser, setSelectedUser] = useState(null)
            const [loading, setLoading] = useState(true)
            const [saving, setSaving] = useState(false)
            const [error, setError] = useState("")

            async function loadData() {
                try {
                    setLoading(true)
                    setError("")

                    const [usersResponse, currentResponse] = await Promise.all([
                        fetch("/user", { method: "POST" }),
                        fetch("/user/7d4e5e38-cebb-4d93-b3f8-67e37472965f", { method: "POST" })
                    ])

                    if (!usersResponse.ok) {
                        throw new Error("Nepodařilo se načíst seznam uživatelů.")
                    }
                    if (!currentResponse.ok) {
                        throw new Error("Nepodařilo se načíst current_user.")
                    }

                    const usersData = await usersResponse.json()
                    const currentData = await currentResponse.json()

                    setUsers(usersData)
                    setCurrentUser(currentData)

                    const selected = usersData.find(u => u.id === currentData.id) || currentData
                    setSelectedUser(selected)
                } catch (e) {
                    setError(e.message || "Došlo k chybě při načítání dat.")
                } finally {
                    setLoading(false)
                }
            }

            useEffect(() => {
                loadData()
            }, [])

            async function selectUser(user) {
                try {
                    setSaving(true)
                    setError("")

                    const response = await fetch(`/user/${user.id}`, {
                        method: "POST"
                    })

                    if (!response.ok) {
                        throw new Error("Nepodařilo se nastavit current_user.")
                    }

                    const data = await response.json()
                    setCurrentUser(data)
                    setSelectedUser(data)
                } catch (e) {
                    setError(e.message || "Došlo k chybě při ukládání.")
                } finally {
                    setSaving(false)
                }
            }

            if (loading) {
                return <div className="alert alert-info">Načítám uživatele…</div>
            }

            return (
                <div className="row">
                    <div className="col-lg-7">
                        <div className="card mb-4">
                            <div className="card-header">
                                Dostupní uživatelé
                            </div>
                            <div className="card-body">
                                {error && <div className="alert alert-danger">{error}</div>}
                                {saving && <div className="alert alert-warning">Ukládám změnu…</div>}

                                {users.length === 0 ? (
                                    <div className="text-muted">Žádní uživatelé nejsou k dispozici.</div>
                                ) : (
                                    users.map(user => (
                                        <UserCard
                                            key={user.id}
                                            user={user}
                                            isCurrent={currentUser?.id === user.id}
                                            onSelect={selectUser}
                                        />
                                    ))
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="col-lg-5">
                        <div className="card mb-4">
                            <div className="card-header">
                                Vybraný uživatel
                            </div>
                            <div className="card-body">
                                {!selectedUser ? (
                                    <div className="text-muted">Není vybrán žádný uživatel.</div>
                                ) : (
                                    <>
                                        <h5 className="mb-1">{selectedUser.fullname}</h5>
                                        <div className="text-muted">{selectedUser.email}</div>
                                        <div className="small text-muted mt-2">id: {selectedUser.id}</div>
                                    </>
                                )}
                            </div>
                        </div>

                        <div className="card">
                            <div className="card-header">
                                Role vybraného uživatele
                            </div>
                            <div className="card-body">
                                {!selectedUser ? (
                                    <div className="text-muted">Nejsou k dispozici žádná data.</div>
                                ) : (
                                    <RoleList roles={selectedUser.roles || []} />
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById("root"))
        root.render(<App />)
    </script>

</body>
</html>
