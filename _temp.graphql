#############################
# Digital Forms
#############################

"""Represents a digital form that captures user input."""
type DigitalForm {
  # Basics:
  """Unique identifier of the digital form."""
  id: ID!
  """The title of the digital form."""
  title: String!
  """A brief description of the digital form."""
  description: String
  """Version of the form (if applicable)."""
  version: String

  # Vectors:
  """Collection of top-level form sections for this form."""
  sections: [FormSection!]!
  """Collection of submissions for this form."""
  submissions: [FormSubmission!]!

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""Represents a section (group) of form fields, supporting nested sections and repetition."""
type FormSection {
  # Basics:
  """Unique identifier of the form section."""
  id: ID!
  """The title of the section."""
  title: String!
  """A brief description of the section."""
  description: String
  """Ordering index for the section."""
  order: Int!

  # Scalars:
  """Reference to the parent section (optional)."""
  parent: FormSection

  # Vectors:
  """Collection of form fields in this section."""
  fields: [FormField!]!
  """Collection of nested sub-sections."""
  sections: [FormSection!]!

  # Repetition:
  """Indicates if the section is repeatable."""
  repeatable: Boolean!
  """Minimum number of repeats (if repeatable)."""
  minRepeats: Int
  """Maximum number of repeats (if repeatable)."""
  maxRepeats: Int

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""Represents a field in a digital form."""
type FormField {
  # Basics:
  """Unique identifier of the form field."""
  id: ID!
  """The label of the form field."""
  label: String!
  """The name of the form field. Must start with a lowercase letter."""
  name: FieldName!
  """The type of the field (e.g., "text", "number", "date", "boolean", "select")."""
  fieldType: String!
  """Placeholder text for the field."""
  placeholder: String
  """Indicates whether this field is required."""
  required: Boolean!
  """Ordering index of the field within its section."""
  order: Int!

  # Scalars:
  """Reference to the digital form to which this field belongs."""
  form: DigitalForm!
  """Reference to the parent section in which this field is placed (optional)."""
  parentSection: FormSection

  # Repetition:
  """Indicates if the field is repeatable."""
  repeatable: Boolean!
  """Minimum number of repeats (if repeatable)."""
  minRepeats: Int
  """Maximum number of repeats (if repeatable)."""
  maxRepeats: Int

  # Computed:
  """Indicates if this field's value is computed from other fields."""
  computed: Boolean!
  """Mathematical formula to calculate the field's value, using variable references (e.g., price * quantity)."""
  formula: String
  """List of dependencies (field names or IDs) that this formula uses."""
  dependencies: [String!]

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""Represents a submission of a digital form filled by a user."""
type FormSubmission {
  # Basics:
  """Unique identifier of the form submission."""
  id: ID!
  """Timestamp when the form was submitted."""
  submittedAt: String!

  # Scalars:
  """Reference to the user who submitted the form."""
  submittedBy: User!
  """Reference to the digital form that was submitted."""
  form: DigitalForm!

  # Vectors:
  """Collection of responses for each form field in this submission."""
  responses: [FieldResponse!]!

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""Represents a response for a specific form field within a submission."""
type FieldResponse {
  # Basics:
  """Unique identifier of the field response."""
  id: ID!
  """The value provided by the user for this field."""
  value: String

  # Scalars:
  """Reference to the form field this response corresponds to."""
  field: FormField!
  """Reference to the form submission that contains this response."""
  submission: FormSubmission!

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

#############################
# Custom Scalars for Name Validation
#############################

"""A string representing a section name; must start with an uppercase letter."""
scalar SectionName

"""A string representing a field name; must start with a lowercase letter."""
scalar FieldName
