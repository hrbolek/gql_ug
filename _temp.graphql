"""
type FormSection {
  # Basics:
  id: ID!
  # Unique identifier for the form section.

  title: String!
  # The title of the section; must start with an uppercase letter.

  description: String
  # A brief description that explains the section's purpose.

  order: Int!
  # Order index determining the section's position within the form.

  # Scalars:
  parent: FormSection
  # Reference to the parent section if this is a nested section.

  repetition: RepetitionInfo
  # A JSON object encapsulating repetition settings.
  # Expected format: { "repeatable": Boolean, "minRepeats": Int, "maxRepeats": Int }
  # Determines whether the section is repeatable and specifies minimum and maximum repeats.

  # Vectors:
  fields: [FormField!]!
  # List of form fields contained within this section.

  sections: [FormSection!]!
  # List of nested subsections within this section.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents a field in a digital form.
Defines properties of the input field, including validation, repetition, and computed value capabilities.
"""
type FormField {
  # Basics:
  id: ID!
  # Unique identifier for the form field.

  label: String!
  # The display label shown to the user.

  name: FieldName!
  # The internal name of the field; must start with a lowercase letter (used for formula references).

  fieldType: String!
  # The type of input (e.g., "text", "number", "date", "boolean", "select").

  placeholder: String
  # Placeholder text displayed in the input field.

  required: Boolean!
  # Indicates if this field is required.

  order: Int!
  # Position index for the field within its section.

  # Scalars:
  form: DigitalForm!
  # Reference to the digital form that includes this field.

  parentSection: FormSection
  # Reference to the section that contains this field.

  # Repetition:
  repeatable: Boolean!
  # Flag indicating whether the field can be repeated.

  minRepeats: Int
  # The minimum number of times the field must be repeated (if repeatable).

  maxRepeats: Int
  # The maximum number of repetitions allowed for the field.

  # Computed:
  computed: Boolean!
  # Indicates whether the field's value is computed automatically.

  formula: String
  # A mathematical formula (expressed as a string) used to compute the field's value.
  # Example: "price * quantity", where "price" and "quantity" are other field names.

  dependencies: [String!]
  # A list of field names or IDs that the formula depends on.
  # This list is used to validate the formula and trigger recalculation if dependencies change.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents a submission of a digital form.
Aggregates all responses provided by a user for the form fields.
"""
type FormSubmission {
  # Basics:
  id: ID!
  # Unique identifier for the form submission.

  submittedAt: String!
  # Timestamp when the form was submitted.

  # Scalars:
  submittedBy: User!
  # The user who submitted the form.

  form: DigitalForm!
  # Reference to the digital form that was completed.

  # Vectors:
  responses: [FieldResponse!]!
  # List of responses for individual fields in the submission.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents a response for a specific field within a form submission.
Links the user's input value to the corresponding form field.
"""
type FieldResponse {
  # Basics:
  id: ID!
  # Unique identifier for the field response.

  value: String
  # The value provided by the user for this field; may be empty if no value was provided.

  # Scalars:
  field: FormField!
  # Reference to the form field for which this response applies.

  submission: FormSubmission!
  # Reference to the form submission containing this response.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents a print template for a digital form.
Used to generate printed versions or official documents from form data.
"""
type DigitalFormPrintTemplate {
  # Basics:
  id: ID!
  # Unique identifier for the print template.

  title: String!
  # Title of the template.

  templateText: String!
  # The content of the template, which may include placeholders for dynamic data.

  # Scalars:
  digitalForm: DigitalForm!
  # Reference to the digital form associated with this template.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

#############################
# Custom Scalars
#############################

"""
A custom scalar representing repetition information as a JSON object.
The JSON object must contain:
  - "repeatable": Boolean indicating if the section/field is repeatable.
  - "minRepeats": Integer specifying the minimum number of repeats.
  - "maxRepeats": Integer specifying the maximum number of repeats.
Example:
  {"repeatable": true, "minRepeats": 1, "maxRepeats": 5}
"""
scalar RepetitionInfo

"""
A custom scalar representing a field name.
The field name must begin with a lowercase letter.
"""
scalar FieldName

"""
A custom scalar representing a section name.
The section name must begin with an uppercase letter.
"""
scalar SectionName

"""
A custom scalar representing a link to the electronic filing service.
This scalar may contain a URL or identifier used for synchronizing with the external ESS.
"""
scalar ESSLink
