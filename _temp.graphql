#############################
# Organizational Entities
#############################

"""
Represents an organizational unit that can be arranged hierarchically.
This entity holds core information about an organizational unit (e.g., a university, faculty, or department).
It includes basic descriptive attributes, relationships to parent/child groups, and system fields for audit and RBAC.
"""
type Group {
  # Basics:
  id: ID! 
  # Unique identifier for the group.

  name: String!
  # The full name of the group.

  description: String
  # A brief description providing additional details about the group.

  path: String
  # The materialized hierarchical path (e.g., "/University/Faculty/Department") for navigation.

  abbreviation: String
  # A short form or abbreviation of the group's name.

  # Scalars:
  parent: Group
  # Reference to the immediate parent group (if applicable); null for top-level groups.

  groupType: GroupType
  # Reference to the type or category that classifies this group.

  # Vectors:
  memberships: [Membership!]!
  # List of memberships that associate users with this group.

  subgroups: [Group!]!
  # List of subgroups that are contained within this group.

  roles: [Role!]!
  # List of roles that are specifically assigned to this group.

  # System:
  createdBy: User!
  # The user who originally created this group record.

  changedBy: User
  # The user who last updated this group record.

  createdAt: String!
  # Timestamp (ISO 8601 format) marking when this group was created.

  changedAt: String
  # Timestamp marking the last update to this group record.

  rbacId: ID!
  # Identifier used in role-based access control to link the group to specific access policies.

  state: State!
  # Current lifecycle state of the group (e.g., Active, Inactive, Archived).
}

"""
Defines the type or category of a group.
Used to classify groups (e.g., University, Faculty, Department).
"""
type GroupType {
  # Basics:
  id: ID!
  # Unique identifier for the group type.

  name: String!
  # The name of the group type.

  # Scalars: (None defined)

  # Vectors: (None defined)

  # System:
  createdBy: User!
  # User who created this group type record.

  changedBy: User
  # User who last modified this group type.

  createdAt: String!
  # Timestamp when the group type was created.

  changedAt: String
  # Timestamp when the group type was last updated.

  rbacId: ID!
  # Identifier used for RBAC purposes.

  state: State!
  # Current lifecycle state of the group type.
}

"""
Represents an individual (user) such as a student, teacher, or administrator.
Stores basic personal information and links to organizational data.
"""
type User {
  # Basics:
  id: ID!
  # Unique identifier for the user.

  firstName: String!
  # The user's first name.

  lastName: String!
  # The user's last name.

  email: String!
  # The user's email address.

  # Scalars: (None defined)

  # Vectors:
  memberships: [Membership!]!
  # List of memberships that associate this user with various groups.

  roles: [Role!]!
  # List of roles assigned to the user.

  studies: [StudyProgram!]!
  # List of study programs in which the user is involved (if applicable).

  # System:
  createdBy: User!
  # User who created this user record.

  changedBy: User
  # User who last updated this user record.

  createdAt: String!
  # Timestamp when the user record was created.

  changedAt: String
  # Timestamp when the user record was last updated.

  rbacId: ID!
  # Identifier for role-based access control for the user.

  state: State!
  # Current lifecycle state of the user.
}

"""
Connects a user to a group and defines the validity period for the membership.
This entity is used to determine organizational affiliations and access rights.
"""
type Membership {
  # Basics:
  joinedAt: String!
  # Timestamp when the membership was initially created.

  startAt: String!
  # Timestamp marking the beginning of the membership's validity period.

  endAt: String!
  # Timestamp marking the end of the membership's validity period.

  # Scalars:
  person: User!
  # The user who is a member.

  group: Group!
  # The group to which the user belongs.

  # Vectors: (None defined)

  # System:
  createdBy: User!
  # User who created this membership record.

  changedBy: User
  # User who last modified this membership record.

  createdAt: String!
  # Timestamp when the membership was created.

  changedAt: String
  # Timestamp when the membership was last updated.

  rbacId: ID!
  # Identifier used for RBAC in the context of this membership.

  state: State!
  # Current state of the membership.
}

"""
Records the assignment of a role to a user within a group.
Essential for RBAC by linking users to their specific roles and permissions.
"""
type Role {
  # Basics:
  id: ID!
  # Unique identifier for the role assignment.

  startAt: String!
  # Timestamp when the role becomes active.

  endAt: String!
  # Timestamp when the role is deactivated or expires.

  # Scalars:
  group: Group!
  # The group context in which the role is assigned.

  person: User!
  # The user who holds this role.

  roleType: RoleType!
  # The type of role that defines permissions and responsibilities.

  # Vectors: (None defined)

  # System:
  createdBy: User!
  # User who created this role record.

  changedBy: User
  # User who last updated this role record.

  createdAt: String!
  # Timestamp when the role record was created.

  changedAt: String
  # Timestamp when the role record was last updated.

  rbacId: ID!
  # Identifier for RBAC purposes.

  state: State!
  # Current lifecycle state of the role.
}

"""
Defines the type or context of a role.
Used to categorize roles and determine their associated permissions.
"""
type RoleType {
  # Basics:
  id: ID!
  # Unique identifier for the role type.

  name: String!
  # The name of the role type (e.g., Examiner, FacultyAdmin).

  description: String
  # Detailed description of what this role type entails.

  # Scalars:
  category: Category
  # Reference to a category grouping similar role types.

  # Vectors:
  roles: [Role!]!
  # List of roles that are assigned this role type.

  # System:
  createdBy: User!
  # User who created this role type record.

  changedBy: User
  # User who last updated this role type record.

  createdAt: String!
  # Timestamp when the role type was created.

  changedAt: String
  # Timestamp when the role type was last updated.

  rbacId: ID!
  # Identifier used for RBAC in the context of this role type.

  state: State!
  # Current state of the role type.
}

"""
Represents a category for classifying role types.
Helps to group similar role types together for management and filtering.
"""
type Category {
  # Basics:
  id: ID!
  # Unique identifier for the category.

  name: String!
  # The name of the category.

  # Scalars: (None defined)
  # Vectors: (None defined)

  # System:
  createdBy: User!
  # User who created this category record.

  changedBy: User
  # User who last updated this category record.

  createdAt: String!
  # Timestamp when the category was created.

  changedAt: String
  # Timestamp when the category was last updated.

  rbacId: ID!
  # Identifier for RBAC purposes in the context of this category.

  state: State!
  # Current state of the category.
}

"""
Represents the state of an entity used for access control and lifecycle tracking.
This entity defines allowed roles and permitted transitions.
"""
type State {
  # Basics:
  id: ID!
  # Unique identifier for the state.

  name: String!
  # The name of the state (e.g., Active, Inactive, Archived).

  description: String
  # A detailed description of what the state represents.

  # Scalars:
  allowedRoles: [String!]!
  # List of role types that are permitted for this state; used to dynamically derive access permissions.

  # Vectors:
  Ins: [State!]!
  # List of states from which a transition to this state is allowed.

  Outs: [State!]!
  # List of states to which a transition from this state is allowed.

  # System:
  createdBy: User!
  # User who created this state record.

  changedBy: User
  # User who last updated this state record.

  createdAt: String!
  # Timestamp when the state was created.

  changedAt: String
  # Timestamp when the state was last modified.

  rbacId: ID!
  # Identifier used for RBAC purposes for this state.

  state: State!
  # Current state of the state record (used for nested lifecycle tracking if needed).
}

"""
Stores historical records of state changes for any entity.
This entity allows tracking the complete lifecycle (e.g., applicant → student → graduate) by recording notes and transitions.
"""
type History {
  # Basics:
  id: ID!
  # Unique identifier for the history record.

  note: String
  # Detailed note describing the state change, including rationale and any comments.

  # Scalars:
  state: State!
  # Reference to the new state after the change.

  changedEntityId: ID!
  # Identifier of the entity in which the state change occurred.

  changedEntityType: String!
  # A string representing the type of the entity (e.g., "Student", "AdmissionApplication").

  # System:
  createdBy: User!
  # User who created this history record.

  changedBy: User
  # User who last modified this history record.

  createdAt: String!
  # Timestamp when the history record was created.

  changedAt: String
  # Timestamp when the history record was last updated.

  rbacId: ID!
  # Identifier for RBAC purposes in the context of this history record.

  state: State!
  # Current state of the history record.
}

"""
Stores sensitive personal data required for GDPR compliance.
This entity holds confidential information that must be protected.
"""
type PersonGDPR {
  # Basics:
  id: ID!
  # Unique identifier for the GDPR record.

  birthNumber: String!
  # The personal identification number (birth number).

  birthSurname: String!
  # The surname at birth (maiden name).

  idCardNumber: String!
  # The identification card number.

  otherSensitiveData: String
  # Any additional sensitive personal data as required.

  # Scalars:
  person: User!
  # Reference to the user to whom these sensitive details belong.

  # System:
  createdBy: User!
  # User who created this GDPR record.

  changedBy: User
  # User who last updated this GDPR record.

  createdAt: String!
  # Timestamp when the GDPR record was created.

  changedAt: String
  # Timestamp when the GDPR record was last modified.

  rbacId: ID!
  # Identifier for RBAC purposes.

  state: State!
  # Current state of the GDPR record.
}

#############################
# Office Entities
#############################

"""
Represents a document containing text and binary data, organized hierarchically.
Used for storing official records and documents.
"""
type Document {
  # Basics:
  id: ID!
  # Unique identifier for the document.

  title: String!
  # Title or name of the document.

  content: String
  # The full textual content or description of the document.

  path: String
  # Materialized path showing the document's location in the hierarchy.

  # Scalars:
  event: Event
  # Reference to the event with which this document is associated (optional).

  parent: Document
  # Reference to a parent document if this document is a subdocument.

  # Vectors:
  subdocuments: [Document!]!
  # List of subdocuments contained within this document.

  # System:
  createdBy: User!
  # User who created the document record.

  changedBy: User
  # User who last modified the document.

  createdAt: String!
  # Timestamp when the document was created.

  changedAt: String
  # Timestamp when the document was last updated.

  rbacId: ID!
  # Identifier used for access control.

  state: State!
  # Current lifecycle state of the document.

  ess: ESSLink
  # Link (URL or identifier) for synchronization with the electronic filing service.
}

"""
Represents an event such as a lecture, exam, meeting, or conference.
Contains scheduling and location information.
"""
type Event {
  # Basics:
  id: ID!
  # Unique identifier for the event.

  name: String!
  # Name of the event.

  description: String
  # Brief description of the event.

  path: String
  # Materialized path indicating the event's position in a hierarchy.

  location: String
  # Description of the event's location (if no facility is defined, this text is used).

  # Scalars:
  eventType: EventType!
  # Reference to the event type, which categorizes the event.

  facility: Facility
  # Reference to the facility where the event takes place (optional).

  parent: Event
  # Reference to a parent event if this event is a subevent.

  startAt: String!
  # Timestamp when the event begins.

  endAt: String!
  # Timestamp when the event ends.

  # Vectors:
  documents: [Document!]!
  # List of documents attached to this event.

  subevents: [Event!]!
  # List of subevents that occur as part of this event.

  invitations: [Invitation!]!
  # List of invitations sent for this event.

  # System:
  createdBy: User!
  # User who created this event record.

  changedBy: User
  # User who last modified this event.

  createdAt: String!
  # Timestamp when the event was created.

  changedAt: String
  # Timestamp when the event was last updated.

  rbacId: ID!
  # Identifier for RBAC in the context of this event.

  state: State!
  # Current state of the event.
}

"""
Defines the type or category of an event (e.g., "general", "examTerm").
Used to classify events.
"""
type EventType {
  # Basics:
  id: ID!
  # Unique identifier for the event type.

  name: String!
  # Name of the event type.

  description: String
  # Detailed description of the event type.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents an invitation for an event.
Tracks the invitation's status and the time it was sent.
"""
type Invitation {
  # Basics:
  id: ID!
  # Unique identifier for the invitation.

  status: String!
  # Status of the invitation (e.g., "accepted", "declined", "excused").

  # Scalars:
  event: Event!
  # The event to which the invitation pertains.

  person: User!
  # The user to whom the invitation is addressed.

  sentAt: String!
  # Timestamp when the invitation was sent.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents a physical or virtual location such as a classroom, lab, or office.
Provides address and organizational context.
"""
type Facility {
  # Basics:
  id: ID!
  # Unique identifier for the facility.

  name: String!
  # Name of the facility.

  address: String!
  # The physical address or description of the facility.

  label: String!
  # A full label for the facility, used for identification (e.g., "KŠ/9a/67a").

  # Scalars:
  parent: Facility
  # Reference to the parent facility if this facility is part of a larger complex.

  group: Group!
  # The organizational group responsible for this facility.

  # Vectors:
  subfacilities: [Facility!]!
  # List of facilities that are nested under this facility.

  events: [Event!]!
  # List of events that take place at this facility.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents a task with support for subtasks and a hierarchical structure.
Useful for modeling workflows or action items.
"""
type Task {
  # Basics:
  id: ID!
  # Unique identifier for the task.

  title: String!
  # Title of the task.

  description: String
  # Detailed description of what the task entails.

  dueAt: String
  # Deadline (timestamp) by which the task should be completed.

  status: String!
  # Current status of the task (e.g., "pending", "in progress", "completed").

  path: String!
  # Materialized path for locating the task within a task hierarchy.

  # Scalars:
  assignedTo: User
  # User assigned to perform the task (optional).

  owner: User
  # User who owns or created the task (optional).

  # Vectors:
  subTasks: [Task!]!
  # List of subtasks that are part of this task.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

#############################
# Academic Entities
#############################

"""
Represents an accredited study program (e.g., Bachelor's or Master's program).
Includes academic details and links to organizational units.
"""
type StudyProgram {
  # Basics:
  id: ID!
  # Unique identifier for the study program.

  title: String!
  # The title or name of the study program.

  level: String!
  # The academic level (e.g., "Bachelor's", "Master's").

  qualification: String!
  # The qualification awarded upon completion (e.g., "BSc.", "MSc.").

  duration: Float!
  # The duration of the program in years.

  description: String
  # A detailed description of the study program.

  # Scalars:
  university: Group!
  # Reference to the university that offers the program.

  group: Group!
  # Reference to the organizational group responsible for the program.

  # Vectors:
  accreditations: [Accreditation!]!
  # List of accreditation decisions related to this program.

  subjects: [Subject!]!
  # List of subjects that are part of the study program.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents an accreditation decision for a study program.
Includes decision number, validity period, and additional notes.
"""
type Accreditation {
  # Basics:
  id: ID!
  # Unique identifier for the accreditation decision.

  decisionNumber: String!
  # The official decision number.

  decisionDateAt: String!
  # Timestamp when the decision was issued.

  validFromAt: String!
  # Timestamp indicating when the accreditation becomes valid.

  validToAt: String!
  # Timestamp indicating when the accreditation expires.

  notes: String
  # Additional remarks or notes regarding the decision.

  # Scalars:
  studyProgram: StudyProgram!
  # The study program being accredited.

  accreditationBody: AccreditationBody!
  # The accreditation body that issued the decision.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents the accreditation body that issues accreditation decisions.
Provides descriptive information and a list of decisions it has issued.
"""
type AccreditationBody {
  # Basics:
  id: ID!
  # Unique identifier for the accreditation body.

  name: String!
  # The name of the accreditation body.

  description: String
  # Detailed description of the accreditation body.

  # Vectors:
  accreditations: [Accreditation!]!
  # List of accreditation decisions issued by this body.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents a subject taught within a study program.
Contains descriptive details and links to its study program and managing group.
"""
type Subject {
  # Basics:
  id: ID!
  # Unique identifier for the subject.

  name: String!
  # The name of the subject.

  description: String
  # Detailed description of the subject content.

  type: String!
  # The category of the subject (e.g., "regular", "admission", "stateFinal").

  # Scalars:
  studyProgram: StudyProgram!
  # Reference to the study program that includes this subject.

  group: Group!
  # The organizational group (e.g., department) responsible for the subject.

  # Vectors:
  semesters: [Semester!]!
  # List of academic semesters during which the subject is taught.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents an academic semester during which a subject is taught.
Includes term, year, and descriptive information.
"""
type Semester {
  # Basics:
  id: ID!
  # Unique identifier for the semester.

  term: String!
  # The term of the semester (e.g., "Fall", "Spring").

  year: Int!
  # The calendar year of the semester.

  description: String
  # Additional description or remarks regarding the semester.

  # Scalars:
  subject: Subject!
  # The subject that is taught during this semester.

  # Vectors:
  studyPlans: [StudyPlan!]!
  # List of study plans available for the semester.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents a thematic grouping of lessons within a semester.
Helps to organize lessons into logical clusters.
"""
type Topic {
  # Basics:
  id: ID!
  # Unique identifier for the topic.

  name: String!
  # The name of the topic.

  description: String
  # A brief description of the topic.

  # Scalars:
  semester: Semester!
  # The academic semester during which this topic is taught.

  # Vectors:
  lessons: [Lesson!]!
  # List of lessons that belong to this topic.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents a lesson or lecture in a subject.
Includes content, duration, and the type of lesson.
"""
type Lesson {
  # Basics:
  id: ID!
  # Unique identifier for the lesson.

  content: String!
  # The main content or description of the lesson.

  length: Float!
  # The duration of the lesson in arbitrary units (could represent hours or credits).

  lessonType: String!
  # The type of lesson (e.g., "lecture", "exercise").

  # Vectors:
  instructors: [User!]!
  # List of instructors or teachers who deliver the lesson.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents a detailed schedule of lessons for a subject during a specific semester.
This plan organizes scheduled lessons and links them to a semester.
"""
type StudyPlan {
  # Basics:
  id: ID!
  # Unique identifier for the study plan.

  description: String!
  # A title or description of the study plan.

  # Scalars:
  semester: Semester!
  # The academic semester for which this study plan is prepared.

  # Vectors:
  scheduledLessons: [ScheduledLesson!]!
  # List of scheduled lesson instances included in this study plan.

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents a scheduled instance of a lesson within a study plan.
Links a lesson to an event, topic, and potentially associated groups.
"""
type ScheduledLesson {
  # Basics:
  id: ID!
  # Unique identifier for the scheduled lesson.

  content: String!
  # A description of the scheduled lesson.

  length: Float!
  # Duration of the lesson instance.

  lessonType: String!
  # The type of lesson for this scheduled instance (e.g., "lecture", "exercise").

  # Scalars:
  event: Event!
  # Reference to the event during which this lesson takes place.

  lesson: Lesson!
  # The base lesson on which this scheduled instance is based.

  topic: Topic!
  # The topic under which this lesson is organized.

  studyPlan: StudyPlan!
  # The study plan that includes this scheduled lesson.

  # Vectors:
  instructors: [User!]!
  # List of instructors assigned to this scheduled lesson.

  groups: [Group!]!
  # List of groups involved in this lesson (e.g., class groups).

  relatedLessons: [Lesson!]!
  # List of lessons that are related to this scheduled lesson (for cross-references).

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
  state: State!
}

"""
Represents a student enrolled in a study program.
Links a user to a study program and tracks the student's current lifecycle state.
"""
type Student {
  # Basics:
  id: ID!
  # Unique identifier for the student record.

  # Scalars:
  person: User!
  # Reference to the user representing this student.

  studyProgram: StudyProgram!
  # The study program in which the student is enrolled.

  state: State!
  # The current state of the student (e.g., "applicant", "active", "graduate", "archived").

  # System:
  createdBy: User!
  changedBy: User
  createdAt: String!
  changedAt: String
  rbacId: ID!
}

"""
Represents an evaluation given to a student.
Stores grading details, attempt numbers, points awarded, and a hierarchical path used for computed evaluations.
"""
type Evaluation {
  # Basics:
  id: ID!
  # Unique identifier for the evaluation record.

  grade: String!
  # The grade or score assigned (e.g., "A", "B", "pass", "fail").

  attempt: Int!
  # Indicates the attempt number for this evaluation (e.g., first, second attempt).

  points: Float
  # The number of points awarded; can be null if not applicable.

  passed: Boolean
  # A boolean flag indicating whether the evaluation result is passing.

  path: String!
  # A string representing the hierarchical structure of sub-evaluations,
  # used for computed or aggregated evaluation values.

  # Scalars:
  student: Student!
  # The student to whom this evaluation is assigned.

  subject: Subject
  # Reference to the subject for which the evaluation is conducted (optional).

  semester: Semester
  # Reference to the semester in which the evaluation was given (optional).

  examEvent: Event
  # Reference to the event representing the exam session (optional).

  admissionProcess: AdmissionProcess
  # Reference to the admission process if the evaluation is related to it (optional).

  evaluationType: EvaluationType!
  # The type or context of the evaluation (e.g., "semester", "admission").

  # Vectors:
  Evaluations: [Evaluation!]!
  # List of sub-evaluations that form a hierarchical breakdown of the overall evaluation.

  # System:
  rbacId: ID!
  # Identifier for RBAC control in the context of this evaluation.

  createdBy: User!
  # User who created the evaluation record.

  changedBy: User
  # User who last modified the evaluation record.

  createdAt: String!
  # Timestamp when the evaluation was created.

  changedAt: String
  # Timestamp when the evaluation was last updated.

  state: State!
